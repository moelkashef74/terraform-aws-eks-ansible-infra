- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600
  become: true

- name: Install required packages
  ansible.builtin.apt:
    name:
      - git
      - curl
      - wget
      - gnupg
      - apt-transport-https
      - software-properties-common
    state: present
  become: true